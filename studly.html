<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Studly</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://js.stripe.com/v3/"></script>
<style>
  :root{
    --bg:#FFFFFF; --line:#E6E4DE; --ink:#1C1A16; --ink-soft:#6B6860;
    --card:#FFFFFF; --accent:#A85C2E; --green:#2E6B4F; --red:#8B2E2E; --gold:#B08B2E;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{ background:var(--bg); color:var(--ink); font-family:'Inter', sans-serif; min-height:100vh; }
  h1,h2,h3{font-family:'Inter', sans-serif; margin:0;}
  button, input, select{font-family:'Inter', sans-serif;}
  .wrap{max-width:640px; margin:0 auto; padding:0 18px 100px;}
  .card-shadow{ box-shadow:0 1px 2px rgba(20,18,12,.04), 0 4px 16px rgba(20,18,12,.05); }

  @keyframes fadeSlideIn{ from{opacity:0; transform:translateY(10px);} to{opacity:1; transform:translateY(0);} }
  @keyframes popIn{ from{opacity:0; transform:scale(.92);} to{opacity:1; transform:scale(1);} }
  @keyframes pulse{ 0%{transform:scale(1);} 40%{transform:scale(1.35);} 100%{transform:scale(1);} }
  @keyframes heartBreak{ 0%{transform:scale(1) rotate(0);} 35%{transform:scale(1.3) rotate(-10deg);} 100%{transform:scale(.7) rotate(8deg); opacity:.3;} }
  @keyframes dotBlink{0%,100%{opacity:.2;}50%{opacity:1;}}
  @keyframes overlayFade{ from{opacity:0;} to{opacity:1;} }

  .animate-in{ animation:fadeSlideIn .32s ease both; }
  .pop{ animation:popIn .22s ease both; }
  * { transition: border-color .15s ease, background-color .15s ease, opacity .2s ease, color .15s ease; }

  /* ---------- TOP BAR ---------- */
  .topbar{ display:flex; align-items:center; justify-content:space-between; padding:16px 0 10px; gap:10px; }
  .brand{ font-weight:800; font-size:17px; letter-spacing:-0.02em; }
  .right-cluster{ display:flex; align-items:center; gap:10px; }
  .avatar-btn{
    width:34px; height:34px; border-radius:50%; border:1.5px solid var(--ink);
    background:var(--card); font-size:15px; display:flex; align-items:center; justify-content:center;
    cursor:pointer; flex:0 0 auto;
  }
  .status-pills{ display:flex; align-items:center; gap:8px; }
  .pill{
    font-size:12.5px; font-weight:500; display:flex; align-items:center; gap:4px;
    background:var(--card); border:1px solid var(--line); padding:5px 9px; border-radius:999px;
  }
  .heart{ display:inline-block; }
  .heart.hit{ animation:heartBreak .4s ease both; }
  .streak.bump{ animation:pulse .4s ease; }
  .lang-btn{
    font-size:12px; font-weight:500; background:var(--card); border:1px solid var(--line);
    color:var(--ink); padding:7px 9px; cursor:pointer; flex:0 0 auto; border-radius:999px;
  }
  .lang-btn:hover{border-color:var(--ink);}
  .lang-menu{
    position:absolute; top:52px; right:18px; z-index:30; background:var(--card); border:1px solid var(--line); display:none; min-width:150px;
    border-radius:12px; overflow:hidden;
  }
  .lang-menu.show{display:block; animation:popIn .16s ease both;}
  .lang-opt{ display:block; width:100%; text-align:left; background:none; border:none; font-size:13.5px; color:var(--ink); padding:9px 13px; cursor:pointer; }
  .lang-opt:hover{background:#F2F1EC;}
  .lang-opt.active{color:var(--accent); font-weight:600;}

  /* ---------- BOTTOM NAV (docked bottom-right) ---------- */
  .bottomnav{
    position:fixed; bottom:0; left:0; z-index:25;
    display:flex; justify-content:flex-start;
    padding:0 0 20px 0;
    pointer-events:none;
  }
  .navgroup{
    display:flex; flex-direction:column; gap:6px; background:var(--card); border:1px solid var(--line); border-radius:26px;
    padding:8px; pointer-events:auto; box-shadow:0 6px 20px rgba(20,18,12,.10); transition:gap .25s ease;
  }
  .navgroup.collapsed{ gap:0; }
  .navbtn{
    background:none; border:none; cursor:pointer; padding:13px 16px;
    display:flex; flex-direction:column; align-items:center; gap:3px;
    color:var(--ink-soft); font-size:10.5px; font-weight:500; border-radius:18px;
    max-height:70px; overflow:hidden; transition:max-height .25s ease, opacity .2s ease, padding .25s ease;
  }
  .navgroup.collapsed .navbtn{ max-height:0; opacity:0; padding-top:0; padding-bottom:0; pointer-events:none; }
  .navbtn .ic{font-size:23px;}
  .navbtn.active{ color:#fff; background:var(--accent); }
  .nav-toggle{
    background:none; border:none; cursor:pointer; color:var(--ink-soft); font-size:16px; font-weight:700;
    padding:10px; display:flex; align-items:center; justify-content:center; border-radius:18px;
  }
  .nav-toggle:hover{ background:#F2F1EC; color:var(--ink); }

  .tabpanel{display:none;}
  .tabpanel.show{display:block;}

  /* ---------- ONBOARDING ---------- */
  #onboardScreen{ padding-top:14px; }
  .logo{ font-weight:800; font-size:26px; letter-spacing:-0.03em; margin-bottom:4px; }
  .avatar-grid{ display:flex; flex-wrap:wrap; gap:8px; margin:14px 0 18px; }
  .avatar-pick{
    width:44px; height:44px; border-radius:50%; border:2px solid var(--line); background:var(--card);
    font-size:19px; display:flex; align-items:center; justify-content:center; cursor:pointer;
  }
  .avatar-pick.sel{ border-color:var(--accent); background:#A85C2E14; }
  .field, .select-field{ width:100%; border:1px solid var(--line); background:var(--card); padding:12px 13px; font-size:15px; color:var(--ink); margin-bottom:10px; border-radius:12px; }
  .field:focus, .select-field:focus{ outline:1px solid var(--accent); }
  .hint{ font-size:12px; color:var(--ink-soft); margin:-2px 0 8px; }
  .auth-error{ font-size:12.5px; color:var(--red); margin:-2px 0 10px; font-weight:500; }
  .toggle-row{ display:flex; gap:8px; margin-bottom:10px; }
  .toggle-btn{
    flex:1; border:1px solid var(--line); background:var(--card); padding:10px; border-radius:12px;
    font-size:13px; font-weight:500; color:var(--ink-soft); cursor:pointer;
  }
  .toggle-btn.sel{ border-color:var(--accent); color:var(--accent); background:#A85C2E0f; font-weight:600; }
  .primary-btn{
    font-size:13px; font-weight:600; background:var(--ink); color:var(--bg);
    border:none; padding:12px 20px; cursor:pointer; border-radius:12px;
  }
  .primary-btn:hover{opacity:.85;}
  .primary-btn:active{transform:scale(.97);}
  .primary-btn:disabled{opacity:.4; cursor:default;}

  /* ---------- EXAM SELECT ---------- */
  .hero p{ color:var(--ink-soft); font-size:14px; line-height:1.55; max-width:48ch; margin:8px 0 0; }
  .exam-list{ display:flex; flex-direction:column; gap:10px; margin-top:16px; }
  .exam{
    display:flex; align-items:center; gap:14px; background:var(--card); border:1px solid var(--line);
    border-left:6px solid var(--e-accent); padding:14px 15px; cursor:pointer; border-radius:14px;
  }
  .exam:hover{border-color:var(--e-accent);}
  .exam:active{transform:scale(.99);}
  .exam .code{ font-size:11px; font-weight:600; color:var(--e-accent); border:1px solid var(--e-accent); padding:3px 7px; flex:0 0 auto; border-radius:999px; }
  .exam .etext{flex:1;}
  .exam .ename{ font-weight:600; font-size:15.5px; }
  .exam .edesc{ font-size:12.5px; color:var(--ink-soft); margin-top:2px; }
  .exam .go{ color:var(--e-accent); font-size:14px; }

  /* ---------- QUIZ ---------- */
  .quizbar{ display:flex; align-items:center; justify-content:space-between; margin:14px 0 16px; }
  .back{ font-size:12px; font-weight:500; color:var(--ink-soft); background:none; border:none; cursor:pointer; }
  .back:hover{color:var(--ink);}
  .tally{ font-size:12px; font-weight:600; color:var(--accent); }
  .sheet{ background:var(--card); border:1px solid var(--line); padding:20px 18px; border-radius:18px; }
  .topic-tag{ display:inline-block; font-size:10.5px; font-weight:600; color:var(--accent); border:1px solid var(--accent); padding:3px 10px; margin-bottom:14px; border-radius:999px; }
  .focus-tag{ display:inline-block; font-size:10.5px; font-weight:600; color:#fff; background:var(--accent); padding:3px 10px; margin:0 6px 14px 0; border-radius:999px; }
  .image-frame{ border:1px solid var(--line); background:#fff; display:flex; align-items:center; justify-content:center; padding:14px; margin-bottom:16px; border-radius:14px; }
  .image-frame svg{ max-width:220px; max-height:220px; width:100%; height:auto; }
  .question{ font-weight:600; font-size:18px; line-height:1.4; margin-bottom:6px; }
  .passage{ font-size:13.5px; line-height:1.6; color:var(--ink-soft); border-left:2px solid var(--line); padding-left:12px; margin:12px 0 16px; border-radius:4px; }
  .options{ display:flex; flex-direction:column; gap:9px; margin-top:16px; }
  .opt{
    display:flex; align-items:flex-start; gap:10px; text-align:left; background:none; border:1px solid var(--line);
    padding:12px 13px; font-size:14.5px; color:var(--ink); cursor:pointer; width:100%; border-radius:12px;
  }
  .opt:hover:not(:disabled){border-color:var(--accent);}
  .opt:active:not(:disabled){transform:scale(.99);}
  .opt .letter{ font-weight:600; font-size:13px; color:var(--ink-soft); flex:0 0 auto; }
  .opt.correct{border-color:var(--green); background:#2E6B4F14;}
  .opt.wrong{border-color:var(--red); background:#8B2E2E14;}
  .opt:disabled{cursor:default;}
  .margin-note{ margin-top:18px; padding-top:16px; border-top:1px dashed var(--line); display:none; }
  .margin-note.show{display:block; animation:fadeSlideIn .25s ease both;}
  .verdict{ font-weight:700; font-size:15px; margin-bottom:6px; }
  .verdict.right{color:var(--green);} .verdict.wrong{color:var(--red);}
  .explain{ font-size:13.5px; line-height:1.6; color:var(--ink-soft); }
  .next-btn{ margin-top:18px; font-size:12.5px; font-weight:600; background:var(--ink); color:var(--bg); border:none; padding:11px 18px; cursor:pointer; border-radius:12px; }
  .next-btn:hover{opacity:.85;}
  .next-btn:active{transform:scale(.97);}
  .loading{ font-size:13px; color:var(--ink-soft); padding:30px 0; text-align:center; }
  .dot{animation:dotBlink 1.2s infinite;}
  .dot:nth-child(2){animation-delay:.2s;} .dot:nth-child(3){animation-delay:.4s;}
  .errbox{ font-size:13.5px; color:var(--red); padding:14px 0; }
  .retry{ font-size:12px; font-weight:600; background:none; border:1px solid var(--red); color:var(--red); padding:6px 12px; cursor:pointer; margin-top:8px; border-radius:10px; }

  .locked{ text-align:center; padding:26px 10px; }
  .locked h3{margin:12px 0 6px;}
  .locked p{color:var(--ink-soft); font-size:13.5px; line-height:1.5;}
  .countdown{ font-size:20px; font-weight:700; color:var(--red); margin:10px 0; }
  .locked-actions{ display:flex; flex-direction:column; gap:9px; margin-top:14px; }

  .suggest-box{ margin-top:14px; padding:13px; border:1px solid var(--accent); border-radius:14px; background:#A85C2E0f; }
  .suggest-box .stitle{font-weight:700; font-size:13.5px;}
  .suggest-box .ssub{font-size:12.5px; color:var(--ink-soft); margin-top:3px;}

  .mode-card{
    display:flex; align-items:center; gap:14px; background:var(--card); border:1px solid var(--line);
    padding:16px; border-radius:16px; cursor:pointer; margin-bottom:12px; text-align:left; width:100%;
  }
  .mode-card:hover{border-color:var(--accent);}
  .mode-card:active{transform:scale(.99);}
  .mode-card.locked{ opacity:.55; cursor:default; }
  .mode-card .m-ic{font-size:24px; flex:0 0 auto;}
  .mode-card .m-title{font-weight:700; font-size:15.5px;}
  .mode-card .m-desc{font-size:12.5px; color:var(--ink-soft); margin-top:2px;}
  .mode-card .m-badge{font-size:11px; font-weight:600; color:var(--accent); margin-top:5px;}

  .summary-score{ text-align:center; padding:6px 0 18px; }
  .summary-score .num{ font-weight:800; font-size:32px; }
  .summary-score .lbl{ font-size:12.5px; color:var(--ink-soft); margin-top:2px; }
  .summary-section{ margin-top:6px; }
  .summary-section-title{ font-weight:700; font-size:13.5px; margin:16px 0 8px; }
  .topic-row{
    display:flex; align-items:center; justify-content:space-between; gap:10px;
    border:1px solid var(--line); border-radius:12px; padding:10px 12px; margin-bottom:8px;
  }
  .topic-row .tr-name{font-size:13px; flex:1;}
  .topic-row .tr-frac{font-size:12px; font-weight:600; color:var(--ink-soft); flex:0 0 auto;}
  .topic-row .tr-btn{
    font-size:11.5px; font-weight:600; background:var(--accent); color:#fff; border:none;
    padding:7px 10px; border-radius:9px; cursor:pointer; flex:0 0 auto;
  }
  .summary-empty{ font-size:13px; color:var(--ink-soft); }

  /* ---------- TUTOR ---------- */
  .tutor{margin-top:22px;}
  .tutor h3{font-size:13.5px; margin-bottom:8px; color:var(--ink-soft); font-weight:500;}
  .tutor-log{display:flex; flex-direction:column; gap:10px; margin-bottom:10px;}
  .tlog-q{font-size:13.5px; color:var(--ink); font-weight:600;}
  .tlog-a{font-size:13.5px; color:var(--ink-soft); line-height:1.55; border-left:2px solid var(--accent); padding-left:10px;}
  .tutor-input{display:flex; gap:8px;}
  .tutor-input input{ flex:1; border:1px solid var(--line); background:#fff; padding:10px 12px; font-size:14px; color:var(--ink); border-radius:12px; }
  .tutor-input input:focus{outline:1px solid var(--accent);}
  .tutor-input button{ font-size:12px; font-weight:600; background:none; border:1px solid var(--ink); color:var(--ink); padding:0 14px; cursor:pointer; border-radius:12px; }
  .tutor-input button:hover{background:var(--ink); color:var(--bg);}
  .tutor-input button:disabled{opacity:.4;}

  /* ---------- FRIENDS ---------- */
  .friend-row{
    display:flex; align-items:center; gap:12px; background:var(--card); border:1px solid var(--line);
    padding:12px 13px; margin-bottom:9px; cursor:pointer; border-radius:14px;
  }
  .friend-row:active{transform:scale(.99);}
  .f-avatar{ width:38px; height:38px; border-radius:50%; background:#F2F1EC; border:1px solid var(--line); display:flex; align-items:center; justify-content:center; font-size:17px; flex:0 0 auto; }
  .f-info{flex:1;}
  .f-name{font-weight:600; font-size:14.5px;}
  .f-streak{font-size:12px; color:var(--ink-soft); font-weight:500;}
  .add-friend-row{ display:flex; gap:8px; margin:14px 0 18px; }
  .add-friend-row input{ flex:1; border:1px solid var(--line); background:var(--card); padding:11px 12px; font-size:14px; border-radius:12px; }

  /* ---------- CHAT ---------- */
  .chat-list-item{ display:flex; align-items:center; gap:12px; background:var(--card); border:1px solid var(--line); padding:12px 13px; margin-bottom:9px; cursor:pointer; border-radius:14px; }
  .chat-preview{font-size:12.5px; color:var(--ink-soft); margin-top:2px;}
  .thread-header{ display:flex; align-items:center; gap:10px; margin-bottom:14px; }
  .thread-back{ background:none; border:none; font-size:12px; font-weight:500; color:var(--ink-soft); cursor:pointer; }
  .bubbles{ display:flex; flex-direction:column; gap:9px; min-height:200px; margin-bottom:14px; }
  .bubble{ max-width:75%; padding:10px 14px; font-size:14px; line-height:1.4; border-radius:16px; }
  .bubble.me{ align-self:flex-end; background:var(--ink); color:var(--bg); border-bottom-right-radius:4px; }
  .bubble.them{ align-self:flex-start; background:#F2F1EC; border:1px solid var(--line); border-bottom-left-radius:4px; }
  .bubble.typing{ font-size:12px; color:var(--ink-soft); }
  .chat-input-row{ display:flex; gap:8px; }
  .chat-input-row input{ flex:1; border:1px solid var(--line); background:var(--card); padding:11px 12px; font-size:14px; border-radius:12px; }

  /* ---------- PROFILE ---------- */
  .profile-card{ background:var(--card); border:1px solid var(--line); padding:22px 18px; text-align:center; margin-bottom:16px; border-radius:18px; }
  .p-avatar{ width:64px; height:64px; border-radius:50%; background:#F2F1EC; border:2px solid var(--accent); display:flex; align-items:center; justify-content:center; font-size:30px; margin:0 auto 10px; }
  .p-name{font-weight:700; font-size:19px;}
  .p-meta{font-size:12.5px; color:var(--ink-soft); margin-top:3px;}
  .badge-row{ display:flex; gap:6px; justify-content:center; flex-wrap:wrap; margin-top:8px; }
  .p-badge{ display:inline-block; font-size:10.5px; font-weight:600; padding:2px 9px; border:1px solid var(--gold); color:var(--gold); border-radius:999px; }
  .p-badge.pass{ border-color:var(--accent); color:var(--accent); }
  .stat-grid{ display:flex; gap:10px; margin-top:16px; }
  .stat-box{ flex:1; background:var(--card); border:1px solid var(--line); padding:14px 8px; text-align:center; border-radius:14px; }
  .stat-num{font-weight:700; font-size:20px;}
  .stat-lbl{font-size:11px; color:var(--ink-soft); margin-top:3px;}
  .profile-actions{display:flex; flex-direction:column; gap:9px; margin-top:18px;}
  .ghost-btn{
    font-size:12.5px; font-weight:600; background:none; border:1px solid var(--ink);
    color:var(--ink); padding:11px; cursor:pointer; border-radius:12px;
  }
  .ghost-btn:hover{background:var(--ink); color:var(--bg);}
  #logoutBtn:hover{ background:var(--red) !important; color:#fff !important; border-color:var(--red) !important; }
  .exam-pass-btn{
    font-weight:600; font-size:14px; width:100%;
    background:linear-gradient(90deg, var(--accent), #7a3f1d); color:#fff; border:none; padding:13px; cursor:pointer; border-radius:12px;
  }
  .exam-pass-btn:hover{opacity:.9;}

  /* ---------- PREMIUM / PASS / EDIT MODALS ---------- */
  .premium-btn{
    width:100%; font-weight:600; font-size:14px;
    background:linear-gradient(90deg, var(--gold), #8a6a1f); color:#fff; border:none; padding:13px; cursor:pointer; border-radius:12px;
  }
  .premium-btn:hover{opacity:.9;}
  .overlay{
    position:fixed; inset:0; background:#1C1A1699; z-index:40; display:none;
    align-items:flex-end; justify-content:center;
  }
  .overlay.show{ display:flex; animation:overlayFade .18s ease both; }
  .modal{
    background:var(--bg); width:100%; max-width:640px; padding:24px 20px 30px;
    border-top:3px solid var(--gold); animation:fadeSlideIn .25s ease both; border-radius:20px 20px 0 0;
  }
  .modal.pass-modal{ border-top-color:var(--accent); }
  .modal.plain-modal{ border-top-color:var(--ink); }
  .modal h2{font-size:20px;}
  .modal .price{ font-weight:800; font-size:30px; margin:10px 0 4px; color:var(--gold); }
  .modal.pass-modal .price{ color:var(--accent); }
  .perk{ display:flex; gap:9px; font-size:14px; margin-top:10px; align-items:flex-start; }
  .perk .chk{color:var(--green); flex:0 0 auto;}
  .modal-close{ background:none; border:none; color:var(--ink-soft); font-size:12px; font-weight:500; cursor:pointer; margin-top:16px; width:100%; text-align:center; }
  .demo-note{ font-size:11px; color:var(--ink-soft); text-align:center; margin-top:10px; }
  .ai-banner{
    display:flex; align-items:center; gap:7px; background:#EFF3F7; border:1px solid #D7E0E8;
    color:#3A4A57; font-size:12px; font-weight:500; padding:9px 12px; border-radius:10px; margin-top:12px;
  }
  .ai-banner.small{ font-size:11px; padding:7px 11px; margin:0 0 12px; }
  .tos-line{ font-size:12px; color:var(--ink-soft); text-align:center; margin-top:12px; line-height:1.5; }
  .tos-line a{ color:var(--ink); font-weight:600; }
  .pay-step{ margin-top:14px; }
  .pay-element-wrap{ border:1px solid var(--line); border-radius:12px; padding:12px; background:var(--card); min-height:44px; }
  .pay-btn{
    width:100%; font-weight:600; font-size:14px; border:none; padding:13px; cursor:pointer;
    border-radius:12px; margin-top:14px; color:#fff; background:var(--ink);
  }
  .pay-btn:hover{opacity:.9;}
  .pay-btn:disabled{opacity:.5; cursor:default;}
  .pay-msg{ font-size:12.5px; margin-top:10px; text-align:center; }
  .pay-msg.err{ color:var(--red); }
  .pay-msg.ok{ color:var(--green); }
  .pay-loading{ font-size:13px; color:var(--ink-soft); text-align:center; padding:14px 0; }

  .hidden{display:none !important;}
</style>
</head>
<body>

<div class="overlay" id="premiumOverlay">
  <div class="modal">
    <h2 id="premTitle"></h2>
    <p id="premSub" style="color:var(--ink-soft); font-size:13.5px; margin-top:6px;"></p>
    <div class="price" id="premPrice"></div>
    <div class="perk"><span class="chk">✓</span><span id="perk1"></span></div>
    <div class="perk"><span class="chk">✓</span><span id="perk2"></span></div>
    <div class="perk"><span class="chk">✓</span><span id="perk3"></span></div>
    <button class="premium-btn" id="premCta" style="margin-top:18px;"></button>

function detectCountry(){
  try{
    const loc = navigator.language || 'en-US';
    const region = (loc.split('-')[1] || 'US').toUpperCase();
    const dn = new Intl.DisplayNames([navigator.language || 'en'], {type:'region'});
    const name = dn.of(region);
    return COUNTRIES.includes(name) ? name : 'Sweden';
  }catch(e){ return 'Sweden'; }
}
function buildCountryOptions(selectEl, selected){
  selectEl.innerHTML = COUNTRIES.map(c=>`<option value="${c}" ${c===selected?'selected':''}>${c}</option>`).join('');
}
function isSwedenCountry(country){ return (country||'').trim().toLowerCase() === 'sweden'; }

function hasActiveExamPass(examId){
  if(!app.examPass) return false;

}

// Pull this user's profile + app_state from Supabase into the local `app`
// object, which still doubles as the fast local cache the rest of the app
// reads from (hearts/streak/topic-stats stay local-only for now — see
// backend/README.md for what a full server-side sync would still need).
async function loadUserIntoApp(session){
  const userId = session.user.id;
  app.userId = userId;
  const [{ data: profileRow }, { data: stateRow }] = await Promise.all([
    sb.from('profiles').select('*').eq('id', userId).single(),
    sb.from('app_state').select('*').eq('user_id', userId).single(),
  ]);
  app.profile = {
    name: profileRow?.name || 'Student',
    avatar: profileRow?.avatar || '🙂',
    country: profileRow?.country || 'Sweden',
    contact: { type: profileRow?.contact_type || 'email', value: session.user.email || session.user.phone || '' },
  };
  if(stateRow){
    app.isPremium = !!stateRow.is_premium;
    app.examPass = stateRow.exam_pass || null;
    app.examPassExpiresAt = stateRow.exam_pass_expires_at ? new Date(stateRow.exam_pass_expires_at).getTime() : null;
  }
  saveState();
}

/* ================= Shared payment helper ================= */
// Calls the backend to create a PaymentIntent (one-time Exam Pass) or a
// subscription's first PaymentIntent (Premium), then mounts Stripe's
// Payment Element into the given container so card entry happens right
// inside this app's own modal — no redirect to a Stripe-hosted page.
async function beginEmbeddedPayment({ kind, examId, mountId, msgId }){
  const msgEl = document.getElementById(msgId);
  msgEl.classList.add('hidden');
  const session = await getSession();
  if(!session){ msgEl.textContent = t('payErrorGeneric'); msgEl.className='pay-msg err'; return null; }

  const mount = document.getElementById(mountId);
  mount.innerHTML = `<div class="pay-loading">${t('payPreparing')}</div>`;

  try{
    const res = await fetch(`${API_BASE}/api/create-payment-intent`, {
      method:'POST',
      headers:{ 'Content-Type':'application/json', 'Authorization': `Bearer ${session.access_token}` },
      body: JSON.stringify({ kind, examId }),
    });
    const data = await res.json();
    if(!res.ok || !data.clientSecret) throw new Error(data.error || 'no client secret');

    const elements = stripe.elements({ clientSecret: data.clientSecret });
    const paymentElement = elements.create('payment');
    mount.innerHTML = '';
    paymentElement.mount(`#${mountId}`);
    return elements;
  }catch(err){
    mount.innerHTML = '';
    msgEl.textContent = t('payErrorGeneric');
    msgEl.className = 'pay-msg err';
    msgEl.classList.remove('hidden');
    return null;
  }
}

async function confirmEmbeddedPayment({ elements, payBtnId, msgId, onSuccess }){
  const payBtn = document.getElementById(payBtnId);
  const msgEl = document.getElementById(msgId);
  payBtn.disabled = true;
  msgEl.textContent = t('payProcessing'); msgEl.className = 'pay-msg'; msgEl.classList.remove('hidden');

  const { error, paymentIntent } = await stripe.confirmPayment({
    elements,
    confirmParams: { return_url: window.location.href },
    redirect: 'if_required',
  });

  if(error){
    msgEl.textContent = error.message || t('payErrorGeneric');
    msgEl.className = 'pay-msg err';
    payBtn.disabled = false;
    return;
  }

  msgEl.textContent = t('paySucceeded');
  msgEl.className = 'pay-msg ok';
  // The webhook writes the actual entitlement to Supabase; give it a moment
  // to land, then pull the fresh state back down.
  await new Promise(r => setTimeout(r, 1500));
  const session = await getSession();
  if(session) await loadUserIntoApp(session);
  renderHearts(); renderProfile();
  onSuccess();
}

/* ================= Claude API ================= */
async function callClaude(system, user){
  const session = await getSession();
  const response = await fetch(`${API_BASE}/api/claude-proxy`, {
    method:"POST",
    headers:{ "Content-Type":"application/json", "Authorization": `Bearer ${session?.access_token || ''}` },
    body: JSON.stringify({ max_tokens:1500, system, messages:[{role:"user", content:user}] })
  });
  if(!response.ok) throw new Error("API " + response.status);
  const data = await response.json();
  const tb = data.content.find(b=>b.type==="text");
  if(!tb) throw new Error("no text");
  return tb.text;
}
function stripFences(s){ return s.replace(/```json/gi,'').replace(/```/g,'').trim(); }
function shuffleOptions(q){
  if(!Array.isArray(q.options) || q.options.length !== 4) return;
  const order = [0,1,2,3];
  for(let i=order.length-1; i>0; i--){
    const j = Math.floor(Math.random()*(i+1));
    [order[i], order[j]] = [order[j], order[i]];
  }
  const newOptions = order.map(i => q.options[i]);
  const newCorrectIndex = order.indexOf(q.correctIndex);
  q.options = newOptions;
  q.correctIndex = newCorrectIndex;
}
function sanitizeSvg(svg){ if(typeof svg!=='string') return ''; const s=svg.trim(); if(!s.startsWith('<svg')) return ''; return s.replace(/<script[\s\S]*?<\/script>/gi,''); }

async function loadQuestion(){
  qBody.innerHTML = `<div class="loading animate-in">${t('loading')}<span class="dot">.</span><span class="dot">.</span><span class="dot">.</span></div>`;
  const exam = EXAMS[quiz.examId];
  const topicKey = quiz.focused ? quiz.focused.topic : exam.subtopics[Math.floor(Math.random()*exam.subtopics.length)];
  const langName = LANGS[lang].full;
  const country = (app.profile && app.profile.country) || 'Sweden';
  const isSwedishSpecial = quiz.examId==='second' && isSwedenCountry(country);
  const system = `You write a single multiple-choice practice question for ${exam.domain}. The subtopic is: "${topicKey}".
Write the question, options, and explanation in ${langName}${isSwedishSpecial ? ' (except Högskoleprovet content, which must be in Swedish regardless)' : ''}.
The learner is based in ${country}. Where the subject matter varies by country (driving rules and road signs, civics/government structure, national symbols), tailor the question specifically to ${country}. Where the exam is inherently tied to one specific country regardless of the learner's location (the Swedish Högskoleprovet), stay accurate to that exam's real country instead.
Decide if this question needs a picture (a road sign, a hand/body position, a diagram, a symbol). If so set needsImage true and provide flat-style SVG in "svg": viewBox="0 0 260 260", basic shapes/paths/text only, no external refs/scripts, depicting exactly the referenced object, without giving away the answer via text unless that text is genuinely part of the real object.
Never end the question text with a stray letter (like "A", "B", "C" or "D"), and never otherwise hint at the correct option's letter anywhere in the question or passage. The only exception: if the question is genuinely asking the learner to identify one of several items that are themselves labeled with letters in an accompanying picture or passage (e.g. "What does sign B mean?"), that label is real content and may stay — it just must not match the correct option's letter.
Respond with ONLY a raw JSON object: {"topic":"short label","needsImage":true|false,"svg":"<svg ...>...</svg> or empty string","passage":"optional, empty string if none","question":"...","options":["A","B","C","D"],"correctIndex":0,"explanation":"2-4 sentences"}
Exactly 4 options, correctIndex 0-based.`;
  try{
    const raw = await callClaude(system, "Generate the question now.");
    const parsed = JSON.parse(stripFences(raw));
    parsed.subtopicKey = topicKey;
    shuffleOptions(parsed);
    quiz.current = parsed;
    renderQuestion(parsed);
  }catch(err){
    qBody.innerHTML = `<div class="errbox animate-in">${t('errbox')}<br><button class="retry" id="retryBtn">${t('retry')}</button></div>`;
    document.getElementById('retryBtn').addEventListener('click', loadQuestion);
  }
}

function renderQuestion(q){
  const letters=['A','B','C','D'];
  const safeSvg = q.needsImage ? sanitizeSvg(q.svg) : '';
  const focusTag = quiz.focused ? `<div class="focus-tag">🎯 ${t('focusedProgressLabel')} · ${quiz.focused.index+1}/${quiz.focused.total}</div>` : '';
  const diagTag = quiz.diag ? `<div class="focus-tag">⏱ ${t('diagModeTitle')} · ${quiz.diag.index+1}/${quiz.diag.total}</div>` : '';
  qBody.innerHTML = `
    <div class="animate-in">
    ${focusTag}
    ${diagTag}
    <span class="topic-tag">${escapeHtml(q.topic||'')}</span>
    ${safeSvg ? `<div class="image-frame">${safeSvg}</div>` : ''}
    <div class="question">${escapeHtml(q.question)}</div>
    ${q.passage ? `<div class="passage">${escapeHtml(q.passage)}</div>` : ''}
    <div class="options">${q.options.map((o,i)=>`<button class="opt" data-i="${i}"><span class="letter">${letters[i]}</span><span>${escapeHtml(o)}</span></button>`).join('')}</div>
    <div class="margin-note" id="marginNote">
      <div class="verdict" id="verdict"></div>
      <div class="explain" id="explainText"></div>
      <button class="next-btn" id="nextBtn">${t('next')}</button>
    </div>
    </div>`;
  document.querySelectorAll('.opt').forEach(btn=> btn.addEventListener('click', ()=> selectAnswer(parseInt(btn.dataset.i))));
}

function getTopicStat(examId, topic){
  if(!app.topicStats[examId]) app.topicStats[examId] = {};
  if(!app.topicStats[examId][topic]) app.topicStats[examId][topic] = {correct:0,total:0,suggested:false};
  return app.topicStats[examId][topic];
}

function maybeSuggestFocused(topic){
  const ts = getTopicStat(quiz.examId, topic);
  if(ts.total>=STRUGGLE_MIN_TOTAL && (ts.correct/ts.total)<=STRUGGLE_MAX_ACCURACY && !ts.suggested){
    ts.suggested = true; saveState();
    const note = document.getElementById('marginNote');
    const box = document.createElement('div');
    box.className = 'suggest-box animate-in';
    box.innerHTML = `<div class="stitle">🎯 ${t('focusedTitle')}</div>
      <div class="ssub">${t('focusedSub')} “${escapeHtml(topic)}”.</div>
      <button class="next-btn" id="startFocusedBtn" style="margin-top:10px;">${t('focusedStart')}</button>`;
    note.appendChild(box);
    document.getElementById('startFocusedBtn').addEventListener('click', ()=>{
      ts.correct = 0; ts.total = 0; ts.suggested = false; saveState();
      startFocused(topic);
    });
  }
}

function startFocused(topic){
  quiz.focused = { topic, index:0, total:8, correct:0 };
  if(!hasUnlimitedHearts(quiz.examId) && app.hearts<=0){ renderLocked(); return; }
  loadQuestion();
}

function renderFocusedComplete(){
  const done = quiz.focused;
  qBody.innerHTML = `<div class="animate-in" style="text-align:center; padding:20px 6px;">
    <div style="font-size:36px;">🎯</div>
    <h3>${t('focusedDoneTitle')}</h3>
    <p style="color:var(--ink-soft); font-size:14px; margin-top:6px;">${done.correct} / ${done.total} — ${escapeHtml(done.topic)}</p>
    <button class="next-btn" id="focusedContinueBtn" style="margin-top:16px;">${t('focusedContinue')}</button>
  </div>`;
  quiz.focused = null;
  document.getElementById('focusedContinueBtn').addEventListener('click', loadQuestion);
}

/* ================= Sound + haptics ================= */
let audioCtx = null;
function getAudioCtx(){
  if(!audioCtx){
    const AC = window.AudioContext || window.webkitAudioContext;
    if(AC) audioCtx = new AC();
  }
  if(audioCtx && audioCtx.state === 'suspended') audioCtx.resume();
  return audioCtx;
}
function playTone(freq, duration, delay, type, gainVal){
  const ctx = getAudioCtx();
  if(!ctx) return;
  const osc = ctx.createOscillator();
  const gain = ctx.createGain();
  osc.type = type || 'sine';
  osc.frequency.value = freq;
  const startTime = ctx.currentTime + (delay || 0);
  gain.gain.setValueAtTime(gainVal || 0.15, startTime);
  gain.gain.exponentialRampToValueAtTime(0.001, startTime + duration);
  osc.connect(gain); gain.connect(ctx.destination);
  osc.start(startTime);
  osc.stop(startTime + duration + 0.02);
}
function playCorrectSound(){
  try{ playTone(880, 0.11, 0, 'sine', 0.14); playTone(1318.5, 0.16, 0.09, 'sine', 0.14); }catch(e){}
}
function playWrongSound(){
  try{ playTone(220, 0.16, 0, 'sawtooth', 0.10); playTone(160, 0.2, 0.1, 'sawtooth', 0.10); }catch(e){}
}
function vibrate(pattern){
  try{ if(navigator.vibrate) navigator.vibrate(pattern); }catch(e){}
}
function playAnswerFeedback(isRight){
  if(isRight){ playCorrectSound(); vibrate(35); }
  else { playWrongSound(); vibrate([40,60,40]); }
}

function selectAnswer(i){
  const q = quiz.current;
  const opts = document.querySelectorAll('.opt');
  opts.forEach(o=> o.disabled=true);
  const isRight = i===q.correctIndex;
  opts[i].classList.add(isRight?'correct':'wrong');
  if(!isRight) opts[q.correctIndex].classList.add('correct');
  playAnswerFeedback(isRight);

  quiz.score.total++; if(isRight) quiz.score.correct++;
  updateTally();
  app.stats.total++; if(isRight) app.stats.correct++;
  bumpStreak();

  const topicName = q.subtopicKey || q.topic || 'general';
  const ts = getTopicStat(quiz.examId, topicName);
  ts.total++; if(isRight) ts.correct++;

  if(!quiz.sessionTopics[topicName]) quiz.sessionTopics[topicName] = {correct:0,total:0};
  quiz.sessionTopics[topicName].total++; if(isRight) quiz.sessionTopics[topicName].correct++;

  if(quiz.focused){ quiz.focused.index++; if(isRight) quiz.focused.correct++; }
  if(quiz.diag){ quiz.diag.index++; if(isRight) quiz.diag.correct++; }
  if(!isRight && quiz.mode!=='diagnostic') loseHeart(quiz.examId);
  saveState();

  document.getElementById('verdict').textContent = isRight ? t('correct') : t('wrong');
  document.getElementById('verdict').className = 'verdict ' + (isRight?'right':'wrong');
  document.getElementById('explainText').textContent = q.explanation;
  document.getElementById('marginNote').classList.add('show');
  document.getElementById('nextBtn').addEventListener('click', ()=>{
    if(quiz.mode==='diagnostic'){
      if(quiz.diag.index>=quiz.diag.total){ clearDiagTimer(); finishSession(true); return; }
      loadQuestion();
      return;
    }
    if(!hasUnlimitedHearts(quiz.examId) && app.hearts<=0){ renderLocked(); return; }
    if(quiz.focused && quiz.focused.index>=quiz.focused.total){ renderFocusedComplete(); return; }
    loadQuestion();
  });

  if(quiz.mode==='practice' && !quiz.focused) maybeSuggestFocused(topicName);
}

function finishSession(wasDiagnostic){
  clearDiagTimer();
  finishBtn.classList.add('hidden');
  const entries = Object.keys(quiz.sessionTopics).map(topic=>({ topic, ...quiz.sessionTopics[topic] }));
  const good = entries.filter(e=> e.total>0 && (e.correct/e.total) >= 0.7).sort((a,b)=> (b.correct/b.total)-(a.correct/a.total));
  const weak = entries.filter(e=> e.total>0 && (e.correct/e.total) < 0.7).sort((a,b)=> (a.correct/a.total)-(b.correct/b.total));

  const titleText = wasDiagnostic ? t('diagSummaryTitle') : t('summaryTitle');
  const timeUpNote = (wasDiagnostic && quiz.diag && quiz.diag.index < quiz.diag.total) ? `<p style="color:var(--red); font-size:12.5px; margin-top:4px;">${t('timeUp')}</p>` : '';

  let html = `<div class="animate-in">
    <div class="question" style="margin-bottom:2px;">${escapeHtml(titleText)}</div>
    ${timeUpNote}
    <div class="summary-score">
      <div class="num">${quiz.score.correct} / ${quiz.score.total}</div>
      <div class="lbl">${t('scoreLabel')}</div>
    </div>`;

  if(entries.length === 0){
    html += `<p class="summary-empty">${t('notEnoughData')}</p>`;
  } else {
    if(good.length){
      html += `<div class="summary-section-title">✅ ${t('goodAt')}</div>`;
      good.forEach(e=>{
        html += `<div class="topic-row"><span class="tr-name">${escapeHtml(e.topic)}</span><span class="tr-frac">${e.correct}/${e.total}</span></div>`;
      });
    }
    if(weak.length){
      html += `<div class="summary-section-title">🎯 ${t('needsPractice')}</div>`;
      weak.forEach((e,idx)=>{
        html += `<div class="topic-row"><span class="tr-name">${escapeHtml(e.topic)}</span><span class="tr-frac">${e.correct}/${e.total}</span><button class="tr-btn" data-topic-idx="${idx}">${t('practiceThisBtn')}</button></div>`;
      });
    }
  }
  html += `<button class="next-btn" id="summaryMoreBtn" style="margin-top:18px;">${t('moreQuestions')}</button></div>`;
  qBody.innerHTML = html;

  weak.forEach((e,idx)=>{
    const btn = qBody.querySelector(`[data-topic-idx="${idx}"]`);
    if(btn) btn.addEventListener('click', ()=>{
      quiz.mode = 'practice'; quiz.diag = null;
      finishBtn.classList.remove('hidden'); finishBtn.textContent = t('finish');
      startFocused(e.topic);
    });
  });
  document.getElementById('summaryMoreBtn').addEventListener('click', renderModeSelect);
}

/* ================= Tutor chat (study) ================= */
const tutorInput = document.getElementById('tutorInput');
const tutorSend = document.getElementById('tutorSend');
const tutorLog = document.getElementById('tutorLog');
async function askTutor(){
  const q = tutorInput.value.trim(); if(!q) return;
  tutorInput.value=''; tutorSend.disabled=true;
  const exam = EXAMS[quiz.examId] || EXAMS.driving;
  const qDiv=document.createElement('div'); qDiv.className='tlog-q animate-in'; qDiv.textContent=q; tutorLog.appendChild(qDiv);
  const aDiv=document.createElement('div'); aDiv.className='tlog-a animate-in'; aDiv.textContent=t('thinking'); tutorLog.appendChild(aDiv);
  try{
    const system = `You are a concise, encouraging study tutor helping someone prepare for ${exam.domain}. Answer directly in 2-5 sentences, in ${LANGS[lang].full}.`;
    aDiv.textContent = await callClaude(system, q);
  }catch(e){ aDiv.textContent = t('tutorErr'); }
  finally{ tutorSend.disabled=false; }
}
tutorSend.addEventListener('click', askTutor);
tutorInput.addEventListener('keydown', e=>{ if(e.key==='Enter') askTutor(); });

/* ================= Friends ================= */
function renderFriends(){
  const list = document.getElementById('friendList');
  list.innerHTML = app.friends.map(f=>`
    <div class="friend-row" data-id="${f.id}">
      <div class="f-avatar">${f.avatar}</div>
      <div class="f-info"><div class="f-name">${escapeHtml(f.name)}</div><div class="f-streak">🔥 ${f.streak} ${t('streakDaysLabel')}</div></div>
    </div>`).join('');
  list.querySelectorAll('.friend-row').forEach(el=> el.addEventListener('click', ()=> openFriendProfile(el.dataset.id)));
}
document.getElementById('addFriendBtn').addEventListener('click', ()=>{
  const input = document.getElementById('addFriendInput');
  const name = input.value.trim(); if(!name) return;
  const id = 'f'+Date.now();
  app.friends.push({ id, name, avatar: AVATARS[Math.floor(Math.random()*AVATARS.length)], streak: Math.floor(Math.random()*8) });
  input.value=''; saveState(); renderFriends(); replayAnim(document.getElementById('friendList'));
});
const friendOverlay = document.getElementById('friendOverlay');
function openFriendProfile(id){
  const f = app.friends.find(x=>x.id===id); if(!f) return;
  document.getElementById('friendModalBody').innerHTML = `
    <div style="text-align:center;">
      <div class="f-avatar" style="width:60px;height:60px;font-size:26px;margin:0 auto 10px;">${f.avatar}</div>
      <div class="p-name">${escapeHtml(f.name)}</div>
      <div class="f-streak" style="margin-top:6px;">🔥 ${f.streak} ${t('streakDaysLabel')}</div>
      <button class="primary-btn" id="msgFriendBtn" style="margin-top:18px;">${t('message')}</button>
      <button class="modal-close" id="friendModalClose">${t('close')}</button>
    </div>`;
  document.getElementById('msgFriendBtn').addEventListener('click', ()=>{ friendOverlay.classList.remove('show'); openThread(f.id); showTab('chat'); });
  document.getElementById('friendModalClose').addEventListener('click', ()=> friendOverlay.classList.remove('show'));
  friendOverlay.classList.add('show');
}

/* ================= Chat ================= */
function renderChatList(){
  const list = document.getElementById('chatList');
  list.innerHTML = app.friends.map(f=>{
    const thread = app.chats[f.id] || [];
    const last = thread.length ? thread[thread.length-1].text : t('chatEmpty');
    return `<div class="chat-list-item" data-id="${f.id}">
      <div class="f-avatar">${f.avatar}</div>
      <div class="f-info"><div class="f-name">${escapeHtml(f.name)}</div><div class="chat-preview">${escapeHtml(last)}</div></div>
    </div>`;
  }).join('');
  list.querySelectorAll('.chat-list-item').forEach(el=> el.addEventListener('click', ()=> openThread(el.dataset.id)));
}
let activeThread = null;
function openThread(id){
  activeThread = id;
  const f = app.friends.find(x=>x.id===id);
  document.getElementById('chatListView').classList.add('hidden');
  document.getElementById('chatThreadView').classList.remove('hidden');
  replayAnim(document.getElementById('chatThreadView'));
  document.getElementById('threadAvatar').textContent = f.avatar;
  document.getElementById('threadName').textContent = f.name;
  renderBubbles();
}
document.getElementById('threadBack').addEventListener('click', ()=>{
  document.getElementById('chatThreadView').classList.add('hidden');
  document.getElementById('chatListView').classList.remove('hidden');
  replayAnim(document.getElementById('chatListView'));
  renderChatList();
});
function renderBubbles(){
  const thread = app.chats[activeThread] || [];
  const el = document.getElementById('bubbles');
  el.innerHTML = thread.map(m=>`<div class="bubble ${m.from==='me'?'me':'them'} pop">${escapeHtml(m.text)}</div>`).join('');
  el.scrollTop = el.scrollHeight;
}
document.getElementById('chatSend').addEventListener('click', sendChat);
document.getElementById('chatInput').addEventListener('keydown', e=>{ if(e.key==='Enter') sendChat(); });
function sendChat(){
  const input = document.getElementById('chatInput');
  const text = input.value.trim(); if(!text || !activeThread) return;
  input.value='';
  if(!app.chats[activeThread]) app.chats[activeThread]=[];
  app.chats[activeThread].push({from:'me', text});
  renderBubbles(); saveState();
  const el = document.getElementById('bubbles');
  const typing = document.createElement('div'); typing.className='bubble them typing pop'; typing.textContent='…';
  el.appendChild(typing); el.scrollTop = el.scrollHeight;
  setTimeout(()=>{
    typing.remove();
    const pool = REPLIES[lang] || REPLIES.en;
    const reply = pool[Math.floor(Math.random()*pool.length)];
    app.chats[activeThread].push({from:'them', text:reply});
    renderBubbles(); saveState();
  }, 700 + Math.random()*500);
}

/* ================= Profile ================= */
function renderProfile(){
  if(!app.profile) return;
  document.getElementById('profAvatar').textContent = app.profile.avatar;
  document.getElementById('profName').textContent = app.profile.name;
  document.getElementById('profMeta').textContent = app.profile.country + (app.profile.contact ? ' · ' + app.profile.contact.value : '');
  document.getElementById('statStreak').textContent = app.streak.count;
  document.getElementById('statCorrect').textContent = app.stats.correct;
  document.getElementById('statTotal').textContent = app.stats.total;

  const profBadge = document.getElementById('profBadge');
  const passBadge = document.getElementById('passBadge');
  const goPremiumBtn = document.getElementById('goPremiumBtn');
  const goExamPassBtn = document.getElementById('goExamPassBtn');

  profBadge.classList.toggle('hidden', !app.isPremium);
  profBadge.textContent = t('premiumActiveBadge');
  goPremiumBtn.classList.toggle('hidden', app.isPremium);
  goPremiumBtn.textContent = t('goPremium');

  if(app.isPremium){
    passBadge.classList.add('hidden');
    goExamPassBtn.classList.add('hidden');
  } else {
    const passActive = hasActiveExamPass();
    passBadge.classList.toggle('hidden', !passActive);
    if(passActive && EXAMS[app.examPass]){
      const daysLeft = Math.max(0, Math.ceil((app.examPassExpiresAt - Date.now()) / 86400000));
      passBadge.textContent = t('passActiveBadge') + ': ' + EXAMS[app.examPass].code + ' · ' + daysLeft + ' ' + t('daysLeftLabel');
    }
    goExamPassBtn.classList.remove('hidden');
    goExamPassBtn.textContent = t('getExamPass') + (passActive && EXAMS[app.examPass] ? ' (' + EXAMS[app.examPass].code + ')' : '');
  }
}

/* ================= Boot ================= */
async function boot(){
  let session = null;
  try{ session = await getSession(); }catch(e){ session = null; }
  if(session){
    try{
      await loadUserIntoApp(session);
      enterApp();
      return;
    }catch(e){
      // Session existed but we couldn't load profile/app_state (e.g. backend
      // not reachable yet) — fall through to the auth screen rather than
      // showing a half-loaded app.
    }
  }
  applyTranslations();
}
boot();
</script>
